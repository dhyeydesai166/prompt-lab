name: checks

on:
  pull_request:
  push:

defaults:
  run:
    working-directory: w02-prompt-lab/w02-prompt-lab

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check src/promptlab/usage.py src/promptlab/day1.py src/promptlab/errors.py src/promptlab/adapters src/promptlab/day2.py src/promptlab/schemas.py src/promptlab/structured.py src/promptlab/day3.py src/promptlab/prompts.py src/promptlab/scoring.py src/promptlab/day4.py src/promptlab/records.py src/promptlab/rules.py src/promptlab/timings.py src/promptlab/run.py tests/test_structured_contract.py tests/test_prompt_registry_contract.py tests/test_scoring.py tests/test_rules_contract.py tests/test_case_latency.py
      - run: uv run mypy src/promptlab/usage.py src/promptlab/day1.py src/promptlab/errors.py src/promptlab/adapters src/promptlab/day2.py src/promptlab/schemas.py src/promptlab/structured.py src/promptlab/day3.py src/promptlab/prompts.py src/promptlab/scoring.py src/promptlab/day4.py src/promptlab/records.py src/promptlab/rules.py src/promptlab/corpus.py src/promptlab/timings.py src/promptlab/run.py tests/test_structured_contract.py tests/test_prompt_registry_contract.py tests/test_scoring.py tests/test_rules_contract.py tests/test_case_latency.py
      - run: uv run pytest tests/test_usage_contract.py tests/test_adapter_contract.py tests/test_structured_contract.py tests/test_prompt_registry_contract.py tests/test_scoring.py tests/test_rules_contract.py tests/test_case_latency.py
